<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches d'écriture</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<div class="app-layout">

  <aside class="sidebar no-print">
    <h1>Fiches d'écriture</h1>

    <div class="history-bar">
      <button type="button" id="btn-undo" class="small" title="Annuler (Ctrl+Z)">↶ Annuler</button>
      <button type="button" id="btn-redo" class="small" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
      <span id="draft-status" class="draft-status" aria-live="polite"></span>
    </div>

    <section>
      <div class="section-title">Réglages par défaut de la fiche</div>
      <div id="global-settings"></div>
    </section>

    <section>
      <div class="section-title">Mes fiches sauvegardées</div>
      <div class="top-actions">
        <button type="button" id="btn-new">Nouvelle fiche</button>
        <button type="button" id="btn-save" class="primary">Enregistrer</button>
      </div>
      <div id="saved-sheets-list"></div>
    </section>

    <section>
      <button type="button" id="btn-print" class="primary print-btn">Imprimer / Exporter en PDF</button>
    </section>
  </aside>

  <main class="main-area">
    <div class="preview-wrapper">
      <div class="preview-stage">
        <div id="fiche-preview"></div>
        <div id="selection-layer" class="no-print">
          <div class="add-line-row">
            <button type="button" id="btn-add-line">+ Ajouter une ligne</button>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="js/model.js"></script>
<script src="js/fonts-catalog.js"></script>
<script src="js/storage.js"></script>
<script src="js/history.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/dotted-text.js"></script>
<script src="js/render.js"></script>
<script src="js/preview-editor.js"></script>
<script src="js/ui-controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
